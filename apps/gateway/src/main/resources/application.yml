# apps/gateway/src/main/resources/application.yml

server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: order
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**
        - id: payment
          uri: http://localhost:8082
          predicates:
            - Path=/payments/**
        - id: inventory
          uri: http://localhost:8083
          predicates:
            - Path=/inventory/**
        - id: notification
          uri: http://localhost:8084
          predicates:
            - Path=/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
