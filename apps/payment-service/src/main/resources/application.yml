# apps/payment-service/src/main/resources/application.yml

server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/paymentdb
    username: payment
    password: payment
  jpa:
    hibernate:
      ddl-auto: update

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      direct:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 500ms
          multiplier: 2.0
          max-interval: 5s
          max-attempts: 3
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

