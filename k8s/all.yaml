apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secrets
  namespace: demo
type: Opaque
stringData:
  RABBIT_USER: guest
  RABBIT_PASS: guest

  ORDER_DB_USER: order
  ORDER_DB_PASS: order

  INVENTORY_DB_USER: inventory
  INVENTORY_DB_PASS: inventory

  PAYMENT_DB_USER: payment
  PAYMENT_DB_PASS: payment
---
# ---------------- RabbitMQ ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: demo-secrets, key: RABBIT_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: demo-secrets, key: RABBIT_PASS } }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: demo
spec:
  selector: { app: rabbitmq }
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: mgmt
      port: 15672
      targetPort: 15672
---
# ---------------- Postgres: Order ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-postgres
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-postgres }
  template:
    metadata:
      labels: { app: order-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - { containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: orderdb }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: demo-secrets, key: ORDER_DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: demo-secrets, key: ORDER_DB_PASS } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-postgres
  namespace: demo
spec:
  selector: { app: order-postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
