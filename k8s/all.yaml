# ---------------- Apps: Gateway (NodePort) ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: app
          image: demo/gateway:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080 }
          # IMPORTANT: gateway doit router vers DNS K8s, pas localhost
          env:
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
              value: http://order-service:8081
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
              value: Path=/orders/**
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_URI
              value: http://payment-service:8082
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0
              value: Path=/payments/**
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_URI
              value: http://inventory-service:8083
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0
              value: Path=/inventory/**
            - name: SPRING_CLOUD_GATEWAY_ROUTES_3_URI
              value: http://notification-service:8084
            - name: SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0
              value: Path=/notifications/**
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: demo
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080